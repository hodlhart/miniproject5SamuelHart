{% extends "base.html" %}

{% block title %}Register - Chapter Cards{% endblock %}

{% block content %}
  <h1 class="h3 mb-4">Register</h1>

  <form method="post">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      {# The typed name is echoed back so a rejected form is not blank. #}
      <input type="text" class="form-control" id="username" name="username"
             value="{{ request.form.get('username', '') }}" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
  </form>

  <p class="mt-3 text-body-secondary">
    Already have an account? <a href="{{ url_for('auth.login') }}">Log in</a>.
  </p>
{% endblock %}
