{% extends "base.html" %}

{% block title %}Parent log in - Pages for Pokemon{% endblock %}

{% block content %}
  <h1 class="h3 mb-2">Parent log in</h1>
  <p class="text-body-secondary">
    For the grown-up who runs the shop. Readers pick their name from the
    <a href="{{ url_for('auth.picker') }}">reader list</a> instead.
  </p>

  <form method="post">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" class="form-control" id="username" name="username"
             value="{{ request.form.get('username', '') }}" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password" required>
    </div>
    <button type="submit" class="btn btn-primary">Log in</button>
  </form>
{% endblock %}
